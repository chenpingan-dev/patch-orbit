name: Test Go analyzer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.23.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/orbit
      - run: go run ./cmd/demo
      - if: runner.os == 'Linux'
        run: go test -race ./...
